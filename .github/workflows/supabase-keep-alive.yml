# Daily keep-alive for the Supabase project, run by GitHub instead of a host.
#
# Supabase pauses free-tier projects after about a week without database
# activity. netlify/functions/keep-alive.mjs does this on Netlify; this does the
# same from GitHub so it keeps working wherever the site is hosted.
#
# It uses the public anon key that ships in supabase.js. Row-level security
# denies every row to it, so the query returns [] and exposes nothing.

name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: netlify/functions
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Query Supabase once
        run: node -e "import('./netlify/functions/keep-alive.mjs').then(m => m.default())"
